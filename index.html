<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Little Anvi | Calculator</title>

    <link rel="icon" type="image/png" href="images/calculator.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">
        <header>
            <h1>♡ Calculator ♡</h1>
            <p>Little Anvi's Calculator</p>
        </header>

        <div class="display">
            <div id="expression" aria-live="polite"></div>
            <output id="result" aria-live="polite">0</output>
        </div>

        <div class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="delete">DEL</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-operator="÷">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="×">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="−">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button data-action="sign">+/−</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>

        <footer>♡ Calculate ♡</footer>
    </main>

    <script src="script.js"></script>

</body>

</html>
